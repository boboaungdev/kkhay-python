[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kkhay"
version = "1.0.4"
description = "Official Python SDK for K Khay — The Non-Custodial Crypto Payment Gateway"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "K Khay", email = "dev@kkhay.com" },
]
keywords = [
    "kkhay",
    "crypto",
    "cryptocurrency",
    "payments",
    "payment-gateway",
    "payment-processor",
    "non-custodial",
    "web3",
    "blockchain",
    "invoice",
    "checkout",
    "webhook",
    "ipn",
    "usdt",
    "usdc",
    "bnb",
    "eth",
    "btc",
    "sol",
    "ton",
    "trx",
    "xrp",
    "doge",
    "ltc",
    "bsc",
    "polygon",
    "arbitrum",
    "base",
    "solana",
    "bitcoin",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Point-Of-Sale",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://kkhay.com"
Documentation = "https://docs.kkhay.com"
Repository = "https://github.com/boboaungdev/kkhay-python"
Issues = "https://github.com/boboaungdev/kkhay-python/issues"

[tool.hatch.build.targets.sdist]
include = [
    "/kkhay",
    "/README.md",
    "/LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["kkhay"]
